<html lang="en">
  <head>
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hopdrop</title>
  </head>
  <body class="d-flex h-100 text-center text-bg-dark">
		<div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <a class="text-white" href="index.html"
            ><h3 class="float-md-start mb-0">Stampatron</h3></a
          >
          <nav class="nav nav-masthead justify-content-center float-md-end">
            <a
              class="nav-link fw-bold py-1 px-0"
              href="https://stampatron.com/index.html"
              >Home</a
            >
            <a
              class="nav-link fw-bold py-1 px-0 active"
              aria-current="page"
              href="https://stampatron.com/projects.html"
              >Projects</a
            >
            <a
              class="nav-link fw-bold py-1 px-0"
              href="https://stampatron.com/cv.html"
              >CV</a
            >
            <a
              class="nav-link fw-bold py-1 px-0"
              href="https://stampatron.com/contact.html"
              >Contact</a
            >
          </nav>
        </div>
      </header>
			<h1>Hopdrop</h1>
			<div class="card text-start">
				<div class="card-header">
    			<ul class="nav nav-tabs card-header-tabs" id="hopdrop-tabs" role="tablist">
						<li class="nav-item presentation">
        			<button class="nav-link active" id="connect-tab" data-bs-toggle="tab" data-bs-target="#connect-pane" type="button" role="tab" aria-controls="connect-pane" aria-selected="true">Connect</button>
						</li>
						<li class="nav-item presentation">
        			<button class="nav-link" id="send-tab" data-bs-toggle="tab" data-bs-target="#send-pane" type="button" role="tab" aria-controls="send-pane" aria-selected="false">Send</button>
						</li>
						<li class="nav-item presentation">
        			<button class="nav-link" id="send-log" data-bs-toggle="tab" data-bs-target="#log-pane" type="button" role="tab" aria-controls="send-pane" aria-selected="false">Logs</button>
						</li>
					</ul>
				</div>
				
				<div class="card-body tab-content">
					<div class="tab-pane fade show active" id="connect-pane" role="tabpanel" aria-labelledby="connect-tab" tabindex="0">
						<div class="row p-1">
							<div id="controls-connect" class="text-start col-8">
								<input id="ws-url" size="30" value="ws://localhost:7420" />
							</div>
							<div class="text-start col-2">
								<button id="connect">connect</button>
							</div>
							<div class=" text-start col-2">
								<i id="connect-status" class="bi bi-x-circle"></i>
							</div>
						</div>
						<div class="row p-1">
							<div id="control-app" class="text-start col-8">
								<input id="device-name" placeholder="your device name" size="18" maxlength="40" />
								<input id="room-code" placeholder="room code (blank = create)" size="20" />
							</div>
							<div class="text-start col-2">
								<button id="join">join</button>
								<button id="leave">leave</button>
							</div>
							<div class="text-start col-2">
									<i id="room-status" class="bi bi-x-circle"></i>
							</div>
						</div>
					</div>

					<div class="tab-pane fade" id="send-pane" role="tabpanel" aria-labelledby="connect-tab" tabindex="0">
						<div class="row p-1">
							<h6>Recipient</h6>
							<div id="transfer-controls" class="text-start col-sm">
								<select id="peer-select"><option value="">(no open channels yet)</option></select>
							</div>
						</div>
						<div class="row p-1">
							<h6>File</h6>
							<div class="col-4">
								<input id="file-input" type="file" />
							</div>
							<div class="col-2">
								<button id="send-file">send file</button>
							</div>
							<div class="col-6">
								<progress id="send-progress" value="0" max="100" style="display: none;"></progress>
								<span id="send-progress-label"></span>
							</div>
						</div>
					</div>
					<div class="tab-pane fade" id="log-pane" role="tabpanel" aria-labelledby="connect-tab" tabindex="0">
						<div id="log" class="text-start text-terminal"></div>
					</div>
				</div>
			</div>
			<div id="status" class="text-terminal text-start">Not connected</div>
			<div class="row p-1">
				<details id="qr-details">
					<summary>Show QR code / join link</summary>
					<div id="qr-code"></div>
					<div id="join-link"></div>
				</details>
			</div>
			<div class="border border-light card-body p-1 text-start">
				<h6>Received Files</h6>
				<ul id="downloads">
					<li>Nothing yet</li>
				</ul>
			</div>
			<main>
				<script type="module" src="./src/index.mts"></script>
				<p>
					<a href="./notes.html">Notes</a> |
					<a target="_" href="https://github.com/stamps9k/hopdrop-client">
						Source Code
					</a>
				</p>
			</main>
			<footer class="mt-auto text-white-50">
			<p>
				Stampatron site created using
				<a href="https://getbootstrap.com/" class="text-white">Bootstrap</a>
				sample code, by
				<a href="https://twitter.com/mdo" class="text-white">@mdo</a>.
			</p>
		</footer>
		</div>
  </body>
</html>
